<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Página no encontrada (404)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #080b11;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-404 {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 520px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
    }
    .code-glitch {
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #0d6efd, #0dcaf0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="text-center card-404 mx-3">
    <i class="bi bi-controller fs-1 text-primary mb-2 d-inline-block"></i>
    <div class="code-glitch mb-2">404</div>
    <h3 class="fw-bold text-light mb-3">Misión no encontrada</h3>
    <p class="text-secondary mb-4">
      La coordenada a la que intentas acceder no existe en el servidor o fue retirada del catálogo.
    </p>
    <a href="index.html" class="btn btn-primary btn-lg px-4 py-2 fw-semibold">
      <i class="bi bi-house-door-fill me-1"></i> Volver a la Base (Inicio)
    </a>
  </div>
</body>
</html>
