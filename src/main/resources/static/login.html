<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    :root {
      --nexus-blue: #0d6efd;
      --nexus-blue-glow: rgba(13, 110, 253, 0.45);
      --nexus-cyan: #0dcaf0;
      --nexus-dark: #080b11;
      --nexus-card: #0f1523;
      --nexus-border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--nexus-dark);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .bg-orbit {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(13, 110, 253, 0.12) 0%, transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(13, 202, 240, 0.08) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .nexus-navbar {
      background: rgba(8, 11, 17, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--nexus-border);
      z-index: 1050;
    }

    .auth-card {
      background: rgba(15, 21, 35, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(13, 110, 253, 0.3);
      border-radius: 1.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(13, 110, 253, 0.2);
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--nexus-blue), var(--nexus-cyan));
    }

    .form-control-dark {
      background-color: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 0.65rem;
      padding: 0.75rem 1rem;
      transition: all 0.25s ease;
    }

    .form-control-dark:focus {
      background-color: rgba(0, 0, 0, 0.75);
      border-color: var(--nexus-blue);
      box-shadow: 0 0 16px var(--nexus-blue-glow);
      color: #fff;
    }

    .btn-premium {
      background: linear-gradient(45deg, #0d6efd, #0dcaf0);
      border: none;
      color: white;
      padding: 0.8rem;
      border-radius: 0.65rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(13, 202, 240, 0.4);
      color: white;
    }

    .btn-password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      z-index: 5;
    }

    .btn-demo-quick {
      background: rgba(13, 202, 240, 0.1);
      border: 1px dashed rgba(13, 202, 240, 0.4);
      color: var(--nexus-cyan);
      border-radius: 0.65rem;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.65rem 1rem;
      transition: all 0.25s ease;
      cursor: pointer;
      width: 100%;
    }

    .btn-demo-quick:hover {
      background: rgba(13, 202, 240, 0.2);
      border-color: var(--nexus-cyan);
      color: #fff;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }
  </style>
</head>
<body>

  <div class="bg-orbit"></div>

  <!-- NAVBAR -->
  <header class="sticky-top nexus-navbar">
    <nav class="navbar navbar-dark container-fluid px-lg-5 py-2">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-light" href="index.html">
        <i class="bi bi-controller fs-3 text-primary"></i>
        <span>Nexus</span>
      </a>

      <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3 border-opacity-50 text-light">
        <i class="bi bi-arrow-left me-1"></i> Ir a la Tienda
      </a>
    </nav>
  </header>

  <!-- FORMULARIO -->
  <main class="container d-flex align-items-center justify-content-center flex-grow-1 py-5">
    <div class="auth-card p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-20 text-primary rounded-circle mb-3" style="width: 58px; height: 58px;">
          <i class="bi bi-controller fs-2"></i>
        </div>
        <h3 class="fw-bold text-light mb-1">Nexus Store</h3>
        <p class="text-secondary small">Autenticación segura para jugadores.</p>
      </div>

      <!-- SECCIÓN LOGIN -->
      <div id="sectionLogin" class="form-section active">
        <h5 class="text-center text-light fw-bold mb-3">Iniciar Sesión</h5>
        
        <form id="formLogin" onsubmit="procesarLogin(event)">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Correo o Gamertag</label>
            <div class="input-group">
              <span class="input-group-text bg-black border-secondary border-opacity-25 text-secondary"><i class="bi bi-envelope"></i></span>
              <input type="text" class="form-control form-control-dark" id="loginEmail" required placeholder="correo@nexus.cl o fludigth">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Contraseña</label>
            <div class="position-relative">
              <input type="password" class="form-control form-control-dark pe-5" id="loginPassword" required placeholder="••••••••">
              <button type="button" class="btn-password-toggle" onclick="togglePassword('loginPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-premium w-100 mb-3" id="btnLoginBtn">
            <i class="bi bi-box-arrow-in-right me-2"></i> ENTRAR A NEXUS
          </button>
        </form>

        <div class="text-center pt-2 border-top border-secondary border-opacity-25">
          <p class="text-secondary small mb-2">¿No tienes cuenta registrada?</p>
          <button class="btn btn-link text-info text-decoration-none p-0 fw-bold small" onclick="toggleForms()">Regístrate aquí</button>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
          <span class="d-block text-secondary small mb-2" style="font-size: 0.75rem;">Acceso rápido de prueba:</span>
          <button type="button" class="btn-demo-quick" onclick="iniciarDemo()">
            <i class="bi bi-person-check-fill me-1"></i> Entrar directo como <strong>@fludigth</strong>
          </button>
        </div>
      </div>

      <!-- SECCIÓN REGISTRO -->
      <div id="sectionRegistro" class="form-section">
        <h5 class="text-center text-light fw-bold mb-3">Crear Cuenta</h5>

        <form id="formRegistro" onsubmit="procesarRegistro(event)">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Nombre Completo</label>
            <input type="text" class="form-control form-control-dark" id="regNombre" placeholder="Vicente González" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label text-secondary small fw-bold">Gamertag</label>
              <input type="text" class="form-control form-control-dark" id="regAlias" placeholder="fludigth" required>
            </div>
            <div class="col-6">
              <label class="form-label text-secondary small fw-bold">Región</label>
              <select class="form-select form-control-dark" id="regRegion">
                <option value="Chile (CLT)" selected>Chile (CLT)</option>
                <option value="Argentina (ART)">Argentina (ART)</option>
                <option value="México (MX)">México (MX)</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control form-control-dark" id="regEmail" placeholder="vicente@nexus.cl" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Contraseña</label>
            <div class="position-relative">
              <input type="password" class="form-control form-control-dark pe-5" id="regPassword" placeholder="••••••••" required>
              <button type="button" class="btn-password-toggle" onclick="togglePassword('regPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="btn btn-premium w-100 mb-3">
            <i class="bi bi-person-plus-fill me-2"></i> REGISTRARSE
          </button>
        </form>
        
        <div class="text-center pt-2 border-top border-secondary border-opacity-25">
          <p class="text-secondary small mb-2">¿Ya tienes una cuenta?</p>
          <button class="btn btn-link text-info text-decoration-none p-0 fw-bold small" onclick="toggleForms()">Inicia sesión aquí</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-black text-secondary py-3 border-top border-dark mt-auto text-center">
    <small>© 2026 Nexus Store. Todos los derechos reservados.</small>
  </footer>

  <script>
    function toggleForms() {
      document.getElementById('sectionLogin').classList.toggle('active');
      document.getElementById('sectionRegistro').classList.toggle('active');
    }

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function procesarLogin(e) {
      e.preventDefault();
      const val = document.getElementById('loginEmail').value.trim();
      const alias = val.includes('@') ? val.split('@')[0] : val;
      
      localStorage.setItem('nexus_user_alias', alias.replace('@', ''));
      localStorage.setItem('nexus_user_nombre', 'Vicente González');
      localStorage.setItem('nexus_user_email', val.includes('@') ? val : `${alias}@nexus.cl`);
      localStorage.setItem('nexus_user_region', 'Chile (CLT)');
      if (!localStorage.getItem('nexus_wallet_balance')) {
        localStorage.setItem('nexus_wallet_balance', '45.00');
      }

      window.location.href = 'cuenta.html';
    }

    function procesarRegistro(e) {
      e.preventDefault();
      const nombre = document.getElementById('regNombre').value.trim();
      const alias = document.getElementById('regAlias').value.trim().replace('@', '');
      const email = document.getElementById('regEmail').value.trim();
      const region = document.getElementById('regRegion').value;

      localStorage.setItem('nexus_user_alias', alias);
      localStorage.setItem('nexus_user_nombre', nombre);
      localStorage.setItem('nexus_user_email', email);
      localStorage.setItem('nexus_user_region', region);
      localStorage.setItem('nexus_wallet_balance', '20.00');

      window.location.href = 'cuenta.html';
    }

    function iniciarDemo() {
      localStorage.setItem('nexus_user_alias', 'fludigth');
      localStorage.setItem('nexus_user_nombre', 'Vicente González');
      localStorage.setItem('nexus_user_email', 'vicente.gonzalez@nexus.cl');
      localStorage.setItem('nexus_user_region', 'Chile (CLT)');
      if (!localStorage.getItem('nexus_wallet_balance')) {
        localStorage.setItem('nexus_wallet_balance', '45.00');
      }

      window.location.href = 'cuenta.html';
    }
  </script>
</body>
</html>
