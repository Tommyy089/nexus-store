<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #080b11;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Fondo animado */
    body::before {
      content: '';
      position: absolute;
      width: 150vw;
      height: 150vh;
      background: radial-gradient(circle, rgba(13, 110, 253, 0.1) 0%, transparent 50%);
      animation: rotateBg 20s linear infinite;
      z-index: -1;
    }
    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Tarjeta principal */
    .auth-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(13, 110, 253, 0.1);
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      position: relative;
      overflow: hidden;
    }

    .form-control-dark {
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      transition: all 0.3s;
    }
    .form-control-dark:focus {
      background-color: rgba(0, 0, 0, 0.7);
      border-color: #0dcaf0;
      box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
      color: #fff;
    }

    .btn-premium {
      background: linear-gradient(45deg, #0d6efd, #0dcaf0);
      border: none;
      color: white;
      padding: 0.8rem;
      border-radius: 0.5rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(13, 202, 240, 0.4);
      color: white;
    }

    /* Ocultar/Mostrar formularios */
    .form-section { display: none; animation: fadeIn 0.4s ease forwards; }
    .form-section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-controller fs-1 text-primary"></i>
      <h3 class="fw-bold text-light mt-2">Nexus Store</h3>
    </div>

    <!-- FORMULARIO DE LOGIN -->
    <div id="sectionLogin" class="form-section active">
      <h5 class="text-center text-secondary mb-4">Iniciar Sesión</h5>
      
      <div id="alertaLogin" class="alert alert-danger d-none small p-2 text-center"></div>

      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">Correo Electrónico</label>
          <input type="email" class="form-control form-control-dark" id="loginEmail" required placeholder="correo@nexus.com">
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold">Contraseña</label>
          <input type="password" class="form-control form-control-dark" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-premium w-100" id="btnLoginBtn">
          <i class="bi bi-box-arrow-in-right me-2"></i> ENTRAR
        </button>
      </form>
      
      <div class="text-center mt-4">
        <p class="text-secondary small m-0">¿No tienes cuenta?</p>
        <button class="btn btn-link text-info text-decoration-none p-0 fw-bold" onclick="toggleForms()">Regístrate aquí</button>
      </div>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <div id="sectionRegistro" class="form-section">
      <h5 class="text-center text-secondary mb-4">Crear Nueva Cuenta</h5>
      
      <div id="alertaRegistro" class="alert alert-danger d-none small p-2 text-center"></div>

      <form id="formRegistro">
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">Nombre Completo</label>
          <input type="text" class="form-control form-control-dark" id="regNombre" required>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label text-secondary small fw-bold">Alias</label>
            <input type="text" class="form-control form-control-dark" id="regAlias" required>
          </div>
          <div class="col-6">
            <label class="form-label text-secondary small fw-bold">País</label>
            <select class="form-select form-control-dark" id="regRegion">
              <option value="Chile (CLT)">Chile</option>
              <option value="Argentina (ART)">Argentina</option>
              <option value="México (MX)">México</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-bold">Correo Electrónico</label>
          <input type="email" class="form-control form-control-dark" id="regEmail" required>
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold">Contraseña</label>
          <input type="password" class="form-control form-control-dark" id="regPassword" required>
        </div>
        
        <button type="submit" class="btn btn-premium w-100" id="btnRegBtn">
          <i class="bi bi-person-plus-fill me-2"></i> REGISTRARSE
        </button>
      </form>
      
      <div class="text-center mt-4">
        <p class="text-secondary small m-0">¿Ya tienes cuenta?</p>
        <button class="btn btn-link text-info text-decoration-none p-0 fw-bold" onclick="toggleForms()">Inicia Sesión</button>
      </div>
    </div>

  </div>

  <script>
    // Cambiar entre Login y Registro
    function toggleForms() {
      document.getElementById('sectionLogin').classList.toggle('active');
      document.getElementById('sectionRegistro').classList.toggle('active');
      document.getElementById('alertaLogin').classList.add('d-none');
      document.getElementById('alertaRegistro').classList.add('d-none');
    }

    // --- LÓGICA DE REGISTRO ---
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnRegBtn');
      btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Cargando...`;
      
      const datosUsuario = {
        nombre: document.getElementById('regNombre').value,
        alias: document.getElementById('regAlias').value,
        region: document.getElementById('regRegion').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      };

      try {
        const res = await fetch('/api/usuarios/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosUsuario)
        });

        if (res.ok) {
          const data = await res.json();
          // Guardar en el navegador
          localStorage.setItem('nexus_user_nombre', data.nombre);
          localStorage.setItem('nexus_user_alias', data.alias);
          localStorage.setItem('nexus_user_region', data.region);
          localStorage.setItem('nexus_user_email', data.email);
          
          // Redirigir a la tienda
          window.location.href = 'index.html';
        } else {
          const err = await res.json();
          const alerta = document.getElementById('alertaRegistro');
          alerta.textContent = err.mensaje || 'Error al registrarse';
          alerta.classList.remove('d-none');
          btn.innerHTML = `<i class="bi bi-person-plus-fill me-2"></i> REGISTRARSE`;
        }
      } catch (error) {
        console.error(error);
        btn.innerHTML = `<i class="bi bi-person-plus-fill me-2"></i> REGISTRARSE`;
      }
    });

    // --- LÓGICA DE LOGIN ---
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLoginBtn');
      btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Cargando...`;

      const credenciales = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch('/api/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(credenciales)
        });

        if (res.ok) {
          const data = await res.json();
          
          // Guardar datos reales de la BD en el navegador
          localStorage.setItem('nexus_user_nombre', data.nombre);
          localStorage.setItem('nexus_user_alias', data.alias);
          localStorage.setItem('nexus_user_region', data.region);
          localStorage.setItem('nexus_user_email', data.email);
          
          // Redirigir a la tienda
          window.location.href = 'index.html';
        } else {
          const err = await res.json();
          const alerta = document.getElementById('alertaLogin');
          alerta.textContent = err.mensaje || 'Credenciales incorrectas';
          alerta.classList.remove('d-none');
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i> ENTRAR`;
        }
      } catch (error) {
        console.error(error);
        btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i> ENTRAR`;
      }
    });
  </script>
</body>
</html>
